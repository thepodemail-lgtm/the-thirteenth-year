// ---------- input ----------
const K={},TI={},KP={};const keymap={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D',KeyZ:'J',KeyJ:'J',Space:'J',KeyX:'A',KeyK:'A',KeyC:'C',KeyL:'C',Enter:'P',Escape:'P'};

let cur={},prev={};
function poll(){prev=cur;cur={};for(const k of 'LRUDJACP'){cur[k]=!!(K[k]||TI[k]||KP[k]);KP[k]=0}
 const gps=navigator.getGamepads?navigator.getGamepads():[];for(const gp of gps){if(!gp)continue;const b=i=>gp.buttons[i]&&gp.buttons[i].pressed,a=gp.axes;
  if(a[0]<-.4||b(14))cur.L=true;if(a[0]>.4||b(15))cur.R=true;if(a[1]<-.5||b(12))cur.U=true;if(a[1]>.5||b(13))cur.D=true;
  if(b(0))cur.J=true;if(b(2)||b(1))cur.A=true;if(b(3))cur.C=true;if(b(9))cur.P=true;}}

// touch

 const on=e=>{e.preventDefault();TI[k]=1;KP[k]=1;el.classList.add('on');audioInit();goFull()},off=e=>{e.preventDefault();TI[k]=0;el.classList.remove('on')};

const dp=document.getElementById('dpad');let dpId=null;
function dpSet(e){const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=22;TI.L=dx<-m?1:0;TI.R=dx>m?1:0;TI.U=dy<-m?1:0;TI.D=dy>m?1:0}

// ---------- audio ----------
let AC=null;function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,f2,vol){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),gn=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);gn.gain.setValueAtTime(vol||.06,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={jump:()=>tone(260,.15,'square',620),slash:()=>tone(1200,.08,'sawtooth',200,.04),hit:()=>tone(220,.1,'square',70),coin:()=>{tone(988,.06);setTimeout(()=>tone(1319,.14),60)},bark:()=>{tone(520,.06,'square',300);setTimeout(()=>tone(480,.08,'square',250),90)},hurt:()=>tone(160,.3,'sawtooth',50,.08),boss:()=>tone(90,.8,'sawtooth',40,.1),buy:()=>{tone(660,.08);setTimeout(()=>tone(880,.08),80);setTimeout(()=>tone(1320,.15),160)},no:()=>tone(120,.2,'square',100),fire:()=>tone(400,.2,'triangle',100,.08),win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',0,.06),i*160))}};

// ---------- game state ----------
let state='intro',tick=0,msg=null,shopSel=0,cam=0,lock=false,checkpoint=3*T,sageTalked=false,god=false;
let life=16,gold=0,swordLv=1,pl,dog,ents,coins,fx,boss,shots;
const MAXLIFE=16;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function newGame(){life=MAXLIFE;gold=0;swordLv=1;lock=false;checkpoint=3*T;sageTalked=false;msg=null;
 ents=[];coins=[];fx=[];shots=[];
 for(const c of [25,38,48,55,70,78,95,108,122,138,150,170,183])ents.push({t:'demon',x:c*T,y:13*T-15,w:10,h:15,vx:0,vy:0,dir:-1,hp:3,hcd:0,fl:0,act:false});

function respawn(){pl={x:checkpoint,y:13*T-15,w:10,h:15,vx:0,vy:0,face:1,atk:0,inv:60,stun:0,onG:false};dog={x:checkpoint-16,y:13*T-9,w:12,h:9,vx:0,vy:0,face:1,mode:'follow',tgt:null,t:0,bite:0,onG:false,cd:0};shots=[];}
function phys(e){e.hitWall=false;e.x+=e.vx;
 if(e.vx>0){const rx=e.x+e.w;if(solid(rx,e.y+1)||solid(rx,e.y+e.h/2)||solid(rx,e.y+e.h-1)){e.x=Math.floor(rx/T)*T-e.w-.01;e.hitWall=true}}
 else if(e.vx<0){if(solid(e.x,e.y+1)||solid(e.x,e.y+e.h/2)||solid(e.x,e.y+e.h-1)){e.x=(Math.floor(e.x/T)+1)*T;e.hitWall=true}}

 if(e.vy>0){const by=e.y+e.h;if(solid(e.x+1,by)||solid(e.x+e.w/2,by)||solid(e.x+e.w-1,by)){e.y=Math.floor(by/T)*T-e.h;e.vy=0;e.onG=true}}
 else if(e.vy<0){if(solid(e.x+1,e.y)||solid(e.x+e.w/2,e.y)||solid(e.x+e.w-1,e.y)){e.y=(Math.floor(e.y/T)+1)*T;e.vy=0}}}

 e.x+=(e.x>pl.x?1:-1)*4;
 if(e.hp<=0){e.dead=true;spark(e.x+e.w/2,e.y+e.h/2,e.t==='spirit'?P.C:P.r,10);const n=e.t==='demon'?2:1;for(let i=0;i<n;i++)coins.push({x:e.x+e.w/2-3,y:e.y+2,w:6,h:6,vx:(Math.random()-.5)*2,vy:-3,v:e.t==='demon'?3:2,l:600})}}

const SHOP=[{n:'REFILL LIFE',p:15},{n:'SWORD UPGRADE',p:30},{n:'LEAVE',p:0}];

function updPlay(){
